[pytest]
markers =
    unit: fast, isolated tests that mock I/O and do not spin up external services
    integration: exercises app wiring or API routes with TestClient or import-time wiring
filterwarnings =
    ignore:The 'timeout' parameter is deprecated:DeprecationWarning
    ignore:The 'verify' parameter is deprecated:DeprecationWarning
#asyncio_mode = auto
pythonpath = 
  services/core
  services/matchmaking
  services/messaging
  services/moderation

# Coverage settings
[coverage:run]
source = services
omit = 
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*
    */node_modules/*
    */__init__.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov