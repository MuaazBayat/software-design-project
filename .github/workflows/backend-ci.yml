name: 🧪 Backend - All Services Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'services/**'
      - 'tests/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'services/**'
      - 'tests/**'

jobs:
  backend-tests:
    name: ✅ All Backend Tests
    runs-on: ubuntu-22.04
    env:
      SUPABASE_URL: http://dummy
      SUPABASE_KEY: dummy
      PYTHONWARNINGS: default
      ENABLE_AUTH: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ steps.setup-python.outputs.python-version || '3.12' }}-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ steps.setup-python.outputs.python-version || '3.12' }}-

      - name: Install deps
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -r tests/requirements.txt
          pip install pytest pytest-cov

      - name: Add repo to PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run all backend unit tests with coverage
        run: |
          pytest -v \
            tests/core/unit \
            tests/matchmaking/unit \
            tests/messaging/unit \
            tests/moderation/unit \
            --maxfail=3 \
            --cov=services \
            --cov-report=term-missing \
            --cov-report=xml:coverage-all-unit.xml \
            --cov-report=html:htmlcov-all-unit \
            --cov-fail-under=75

      - name: Run all backend integration tests with coverage
        run: |
          pytest -v \
            tests/core/integration \
            tests/matchmaking/integration \
            tests/messaging/integration \
            tests/moderation/integration \
            --maxfail=3 \
            --cov=services \
            --cov-report=term-missing \
            --cov-report=xml:coverage-all-integration.xml \
            --cov-report=html:htmlcov-all-integration \
            --cov-fail-under=50

      - name: Upload unit test coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-unit
          path: |
            coverage-all-unit.xml
            htmlcov-all-unit/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload integration test coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-integration
          path: |
            coverage-all-integration.xml
            htmlcov-all-integration/**
          if-no-files-found: ignore
          retention-days: 7

