name: ☁️ Deploy Frontend to Cloud Run

env:
  TAG: ${{ github.event.release.tag_name || 'release-test' }}
  FRONTEND_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/globetalk-frontend:${{ github.event.release.tag_name || 'release-test' }}

on:
  release:
    types: [published]  # Trigger when a GitHub release is published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & push Frontend Docker images
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }} \
            --build-arg CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }} \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_KEY=${{ secrets.SUPABASE_KEY }} \
            --build-arg NEXT_PUBLIC_FRONTEND_URL=${{ secrets.FRONTEND_URL }} \
            --build-arg NEXT_PUBLIC_CORE_URL=${{ secrets.CORE_URL }} \
            --build-arg NEXT_PUBLIC_MATCHMAKING_URL=${{ secrets.MATCHMAKING_URL }} \
            --build-arg NEXT_PUBLIC_MESSAGING_URL=${{ secrets.MESSAGING_URL }} \
            --build-arg NEXT_PUBLIC_MODERATION_URL=${{ secrets.MODERATION_URL }} \
            -t $FRONTEND_IMAGE \
            -f services/frontend/frontend.Dockerfile \
            services/frontend/.
          docker push $FRONTEND_IMAGE

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Deploy frontend Cloud Run
        id: deploy-frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'globetalk-frontend'
          image: ${{ env.FRONTEND_IMAGE }}
          flags: '--allow-unauthenticated --port=3000'
          container_port: 3000

      - name: Show Output
        run: |
          echo "Deployment finished!"
          echo "Frontend deployed at:"
          echo "${{ steps.deploy-frontend.outputs.url }}"