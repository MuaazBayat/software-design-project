name: 🐳 Frontend - Docker Build & Push

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'services/frontend/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'services/frontend/**'

jobs:
  unit-tests:
    name: Unit Test & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm test -- --ci

  integration-tests:
    name: Integration Test & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests with coverage
        # Assuming you have a script like "test:int" in your package.json
        run: npm run test:int -- --ci
        
  docker-build-push:
    # This job now depends on both test jobs completing successfully
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-22-04
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set Docker image tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "FRONTEND_IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/globetalk-frontend:$SHORT_SHA" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE_LATEST=${{ secrets.DOCKER_HUB_USERNAME }}/globetalk-frontend:latest" >> $GITHUB_ENV

      - name: Build & Push Frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }} \
            --build-arg CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }} \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_KEY=${{ secrets.SUPABASE_KEY }} \
            --build-arg NEXT_PUBLIC_FRONTEND_URL=${{ secrets.FRONTEND_URL }} \
            --build-arg NEXT_PUBLIC_CORE_URL=${{ secrets.CORE_URL }} \
            --build-arg NEXT_PUBLIC_MATCHMAKING_URL=${{ secrets.MATCHMAKING_URL }} \
            --build-arg NEXT_PUBLIC_MESSAGING_URL=${{ secrets.MESSAGING_URL }} \
            --build-arg NEXT_PUBLIC_MODERATION_URL=${{ secrets.MODERATION_URL }} \
            --build-arg NEXT_PUBLIC_FPJS_KEY=${{ secrets.FPJS_KEY }} \
            -t $FRONTEND_IMAGE \
            -t $FRONTEND_IMAGE_LATEST \
            -f services/frontend/frontend.Dockerfile \
            services/frontend \
            --push
