name: ☁️ Deploy Core to Cloud Run

env:
  TAG: ${{ github.event.release.tag_name || 'release-test' }}
  CORE_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/globetalk-core:${{ github.event.release.tag_name || 'release-test' }}

on:
  release:
    types: [published]  # Trigger when a GitHub release is published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          
      - name: Build & Push Core Docker Image
        run: |
          docker buildx build --no-cache \
            --platform linux/amd64 \
            -t $CORE_IMAGE \
            -f services/core/core.Dockerfile \
            . \
            --push

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Deploy core Cloud Run
        id: deploy-core
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'globetalk-core'
          image: ${{ env.CORE_IMAGE }}
          flags: '--allow-unauthenticated --port=8000 --update-env-vars=[SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_KEY=${{ secrets.SUPABASE_KEY }},FRONTEND_URL=${{ secrets.FRONTEND_URL }},CORE_URL=${{ secrets.CORE_URL }},MATCHMAKING_URL=${{ secrets.MATCHMAKING_URL }},MESSAGING_URL=${{ secrets.MESSAGING_URL }},MODERATION_URL=${{ secrets.MODERATION_URL }},ENABLE_AUTH=true]'
          container_port: 8000

      - name: Show Output
        run: |
          echo "Deployment finished!"
          echo "Core deployed at:"
          echo "${{ steps.deploy-core.outputs.url }}"