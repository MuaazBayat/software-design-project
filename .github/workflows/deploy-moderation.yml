name: ☁️ Deploy Moderation to Cloud Run

env:
  TAG: ${{ github.event.release.tag_name || 'release-test' }}
  MODERATION_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/globetalk-moderation:${{ github.event.release.tag_name || 'release-test' }}

on:
  release:
    types: [published]  # Trigger when a GitHub release is published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & push Moderation Docker images
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $MODERATION_IMAGE \
            -f services/moderation/moderation.Dockerfile \
            services/moderation/.
          docker push $MODERATION_IMAGE

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
      
      - name: Deploy moderation Cloud Run
        id: deploy-moderation
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'globetalk-moderation'
          image: ${{ env.MODERATION_IMAGE }}
          flags: '--allow-unauthenticated --port=8000 --update-env-vars=[SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_KEY=${{ secrets.SUPABASE_KEY }},FRONTEND_URL=${{ secrets.FRONTEND_URL }},CORE_URL=${{ secrets.CORE_URL }},MATCHMAKING_URL=${{ secrets.MATCHMAKING_URL }},MESSAGING_URL=${{ secrets.MESSAGING_URL }},MODERATION_URL=${{ secrets.MODERATION_URL }},ENABLE_AUTH=true]'
          container_port: 8000

      - name: Show Output
        run: |
          echo "Deployment finished!"
          echo "Moderation deployed at:"
          echo "${{ steps.deploy-moderation.outputs.url }}"